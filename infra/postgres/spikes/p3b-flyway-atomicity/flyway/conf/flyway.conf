# =============================================================================
# NOXUND P3B — Flyway 13.1.0 Community configuration (fixed contract).
# Password is NOT here (never in Compose/inspect/transcript/Git) — the entrypoint
# wrapper injects FLYWAY_PASSWORD from /run/secrets at exec time only.
# -----------------------------------------------------------------------------
# Flyway-13 correction (binding): DO NOT use flyway.initSql. The least-privilege
# identity is established by the SQL callback afterConnect__set_noxund_owner.sql,
# discovered via the callbacks location below.
# =============================================================================

flyway.url=jdbc:postgresql://postgres:5432/flyway_spike
flyway.user=noxund_migrator

# Fixed per Bloco 2.
flyway.defaultSchema=public
flyway.table=flyway_schema_history
flyway.group=false
flyway.mixed=false
flyway.executeInTransaction=true

# Migrations in /flyway/sql; the SQL callback lives in /flyway/callbacks. SQL
# callbacks are discovered from locations (flyway.callbacks= is for Java classes).
flyway.locations=filesystem:/flyway/sql,filesystem:/flyway/callbacks

# Hardening: destructive/rewrite operations are forbidden for this spike. clean is
# disabled here; clean/repair/baseline/undo are ALSO refused by the entrypoint sentinel.
flyway.cleanDisabled=true
flyway.baselineOnMigrate=false
flyway.validateOnMigrate=true

# Give the DB a moment to accept connections on first bring-up (no egress; local net only).
flyway.connectRetries=15
flyway.connectRetriesInterval=2
