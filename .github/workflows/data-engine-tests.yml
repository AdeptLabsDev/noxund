name: Data Engine · Resolver Tests (CI)

# WHY NOT MANUAL-ONLY (deliberate deviation from the *-db-apply gated template) -
# This is a READ-ONLY TEST job: it runs the data-engine resolver unit suite. It
# touches NO secret, NO Environment, NO database, NO production. So — unlike the
# gated apply workflows (phase*-db-apply.yml / entity-db-apply.yml, which are
# workflow_dispatch + confirm phrase + production-db required reviewers) — this one
# runs automatically on push / pull_request, which is the correct posture for a
# test job and a non-negotiable for reproducibility (the green must not be bound to
# one workstation). It anchors the deterministic seed of P5-REPRO-01.
#
# Because it is read-only and secret-free, there is NO mandatory Security gate.
# If it ever gains a secret / Environment / DB access, that is a Deploy/ambiente
# change → Security review (agent-review-matrix.md #8) BEFORE merge.
#
# HARDENING: permissions contents:read (no write anywhere); actions SHA-pinned
# (SEC-F17); ZERO secrets; ZERO Environment; ZERO DB. stdlib-only — pyproject
# dependencies=[] → the TEST jobs do ZERO pip install, ZERO sensitive env
# change. (The separate collection-driver-contract job below is the one
# deliberate exception: it installs the hash-pinned collection-runtime driver
# from requirements-collect.txt to prove `import psycopg` BEFORE any real
# dispatch — still no secret, no Environment, no DB.)
#
# SAME-ARTIFACT PARITY (D3) — READ THIS BEFORE EDITING A STEP BELOW.
# The substantive quality logic of the two test jobs is NOT in this file. It
# lives in ONE checked-in, stdlib-only entrypoint that a developer invokes
# identically:
#
#     python services/data-engine/run_quality_checks.py
#
# Expected test counts, the ×2 independent-process repetition, the golden-digest
# assertions and every fail-closed exit are defined THERE and nowhere else, so
# this workflow cannot drift from the command a developer runs. Do not
# re-encode an assertion here: change the entrypoint, which CI and local both
# execute. That file's own docstring states exactly what it covers and, more
# importantly, what it does NOT (DEC-0042 §D10).
#
# DETERMINISM: the full suite runs TWICE in independent processes and BOTH must
# report exactly the locked count (276 = 18 resolver + 19 channel-filter + 28 scoring + 37 opportunity + 13 channel-collection + 39 video-collection + 21 repro-harness + 24 sg8-runner + 50 sg8-postgres-adapter + 27 sg8-coordinator; SG-8 rebaselined by DEC-0025 LLM-decoupling + provenance-completeness + comparison-contract correctives). A
# discovery regression that silently ran fewer tests
# would still exit 0 in unittest, so the entrypoint asserts the COUNT
# fail-closed. The dedicated repro-harness job additionally proves the
# P5-REPRO-01 golden digest is byte-identical across two computations and equals
# the locked GOLDEN_DIGEST.
#
# THE COLLECTION-DRIVER-CONTRACT JOB IS DELIBERATELY NOT CONSOLIDATED. It is
# ENVIRONMENT-SPECIFIC: it exists to prove that a real hash-pinned install
# imports, which cannot be asserted without performing that install. Making it
# a developer default would materially alter a local environment the entrypoint
# otherwise never touches, so it stays CI-only as an ACCEPTED, DOCUMENTED
# exception rather than being forced into the default local command.
#
# SCOPE (negative): does NOT apply migrations, does NOT touch production-db, does
# NOT use Environment/secret, does NOT unlock Phase 9. 0007/producer_events PARKED.
# --------------------------------------------------------------------------

on:
  push:
    paths:
      - 'services/data-engine/**'
      - '.github/workflows/data-engine-tests.yml'
  pull_request:
    paths:
      - 'services/data-engine/**'
      - '.github/workflows/data-engine-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

# Test job (not an apply): cancel superseded runs on the same ref to save runners.
# (Apply workflows deliberately use cancel-in-progress: false — a half-applied
# migration must never be cancelled. Here there is nothing to corrupt.)
concurrency:
  group: data-engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolver-tests:
    name: Entity Resolution resolver suite (Python 3.11, ×2 determinism)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.11 (pinned)
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'

      - name: Assert interpreter is CPython 3.11.x
        run: |
          set -euo pipefail
          ver="$(python -c 'import platform; print(platform.python_version())')"
          echo "Python: ${ver}"
          case "$ver" in
            3.11.*) echo "OK — Python 3.11.x pinned." ;;
            *) echo "::error::Expected Python 3.11.x, got ${ver}."; exit 1 ;;
          esac

      - name: Run the data-engine suite through the canonical checked-in entrypoint
        run: |
          set -euo pipefail
          # THE SAME COMMAND A DEVELOPER RUNS. The expected count, the ×2
          # independent-process repetition and the fail-closed assertions all
          # live inside run_quality_checks.py — this workflow holds NO second
          # copy of them, so CI and local can no longer drift (D3;
          # DEC-0042 §D9). It needs no PYTHONPATH and no working-directory:
          # the entrypoint establishes its own import path from its own
          # location, using the platform's own separator.
          python services/data-engine/run_quality_checks.py suite

  repro-harness:
    name: P5-REPRO-01 reproducibility harness (Python 3.11, ×2 + golden digest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.11 (pinned)
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'

      - name: Assert interpreter is CPython 3.11.x
        run: |
          set -euo pipefail
          ver="$(python -c 'import platform; print(platform.python_version())')"
          echo "Python: ${ver}"
          case "$ver" in
            3.11.*) echo "OK — Python 3.11.x pinned." ;;
            *) echo "::error::Expected Python 3.11.x, got ${ver}."; exit 1 ;;
          esac

      - name: Run the repro harness through the canonical checked-in entrypoint
        run: |
          set -euo pipefail
          # THE SAME COMMAND A DEVELOPER RUNS. Expected count, ×2 independent
          # processes and the fail-closed assertions live in the entrypoint.
          python services/data-engine/run_quality_checks.py repro

      - name: Run the golden digest through the canonical checked-in entrypoint
        run: |
          set -euo pipefail
          # THE SAME COMMAND A DEVELOPER RUNS. Both assertions — the two
          # computations are byte-identical, AND the value equals the locked
          # GOLDEN_DIGEST — live inside the entrypoint, which exits non-zero
          # fail-closed on either failure.
          #
          # This step previously set `PYTHONPATH: src:tests`. That separator
          # is POSIX-only: the job was correct because it runs on Linux, but
          # the same command failed on Windows with `ModuleNotFoundError: No
          # module named 'test_repro_harness'`, so the documented command was
          # not one a developer on the other supported platform could run
          # (D0 §9). The entrypoint now owns its import path and builds it
          # with the platform's own separator, so there is no PYTHONPATH here
          # to be wrong on either platform.
          python services/data-engine/run_quality_checks.py digest

  collection-driver-contract:
    name: Collection driver contract (hash-pinned psycopg installs + imports; no secret, no DB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.11 (pinned)
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'

      - name: Install from the single pin source (hash-verified, binary-only)
        run: |
          set -euo pipefail
          # Contract added after the first SG-V7 dispatch (run 29389945976)
          # failed with "postgresql driver not provisioned" — fail-closed,
          # pre-write: 1 failed workflow run, 0 collections, 0 run_id,
          # 0 writes, 0 quota. The §8 suites use in-memory fakes by design, so
          # they can never exercise this import; this job closes that blind
          # spot in CI, BEFORE any real dispatch. Same install line as the
          # collect jobs of video-collection.yml / youtube-collection.yml;
          # the pins live ONLY in requirements-collect.txt (anti-drift).
          python -m pip install --require-hashes --only-binary=:all: \
            -r services/data-engine/requirements-collect.txt

      - name: Prove import psycopg + pinned version (the exact check the collect jobs run)
        run: |
          set -euo pipefail
          expected="$(grep -Eo '^psycopg==[0-9][^ \\]*' services/data-engine/requirements-collect.txt | cut -d= -f3)"
          python -c "import sys, psycopg; e=sys.argv[1]; a=psycopg.__version__; assert a==e, f'driver contract: psycopg {a} != pinned {e}'; print(f'driver contract OK — psycopg {a} (pinned, hash-verified)')" "$expected"
