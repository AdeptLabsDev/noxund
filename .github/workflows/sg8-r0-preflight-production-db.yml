name: SG-8 · R0 Preflight (READ-ONLY, pre-0008) — production-db

# =============================================================================
# R0 PREFLIGHT — READ-ONLY diagnosis of the REMOTE production database BEFORE any
# SG-8 migration (0008/0009). This workflow APPLIES NOTHING. It runs a single
# read-only transaction (REPEATABLE READ, READ ONLY, final ROLLBACK) and reports
# GREEN (environment exactly compatible + SG-8 objects absent) or RED.
#
# THREAT MODEL / INVARIANTS (Security + DevOps + Database review surface):
#   • MANUAL ONLY — workflow_dispatch; never push/PR/schedule.
#   • Dispatch restricted to `main`: the `production-db` Environment's deployment
#     branch rule DENIES the Environment/secrets to any ref ≠ main (SEC-F18); we
#     also assert github.ref == refs/heads/main AND that target_sha == the CURRENT
#     origin/main tip (TIP-OF-MAIN, not merely an ancestor) — any advance of main
#     between authorization and dispatch invalidates the gate; a stale ancestor SHA
#     is rejected. Binds the preflight to the exact bytes to be applied next.
#   • FINAL verdict = GREEN xor RED. Backup evidence (operator-supplied at dispatch,
#     validated by the human reviewer) gates FINAL: absent/placeholder ⇒ RED. No
#     GREEN-WITH-NOTES; no TECHNICAL_GREEN authorization; no Management API/token.
#   • EXACTLY ONE Environment: production-db (inherits required reviewers). NO
#     other environment. NO new secret. NO `configure_env`.
#   • permissions: contents: read ONLY (no write scope, no id-token).
#   • NO migration / repair / push / apply / DDL command anywhere. NO `supabase`
#     CLI (no link/db push/db reset/migration up). psql runs ONLY the read-only
#     preflight .sql; the SQL's own READ ONLY txn + final ROLLBACK make writes
#     impossible (and a write probe PROVES it, SQLSTATE 25006).
#   • The DB URL is built from the Environment secret/vars and MASKED
#     (::add-mask::) — never echoed; the SQL output carries no secret.
#   • Every `uses:` action is pinned by full commit SHA (SEC-F17).
#
# FAITHFUL MIRROR of the production-db governance in phase5/entity-db-apply.yml
# (same Environment, same secret SUPABASE_DB_PASSWORD + vars HOST/PORT/USER, same
# session-pooler IPv4-safe URL) — MINUS every write path. Any deviation (new
# permissions/secrets/triggers, a second Environment, any DDL/apply) → Security
# review (agent-review-matrix.md #8) BEFORE merge.
#
# DOES NOT DISPATCH ON AUTHORING. R1..R7 remain blocked; each future gate needs a
# fresh GO. See docs/product/decisions/DEC-0027-sg8-remote-promotion-r0-preflight.md.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'FULL 40-char lowercase Git commit SHA on main to check out (NOT a branch/tag/short SHA).'
        required: true
        type: string
      confirm:
        description: 'Type PREFLIGHT-SG8-R0-READONLY-NO-WRITES to confirm a READ-ONLY preflight (applies nothing).'
        required: true
        type: string
      # ---- Operator backup evidence (gates the FINAL verdict; RED-default) ----
      # No Management API, no token, no external call: the operator supplies these
      # at dispatch and the human Environment reviewer validates the referenced
      # evidence before approving. Any empty/placeholder value ⇒ FINAL RED. The
      # workflow NEVER self-attests backup and NEVER accepts TECHNICAL_GREEN.
      backup_pitr_available:
        description: 'Backup evidence — is PITR or a verified backup available? FINAL is RED unless "yes".'
        required: true
        type: choice
        options: ['no', 'yes']
        default: 'no'
      backup_timestamp:
        description: 'Backup evidence — date/time of the last backup (empty ⇒ RED).'
        required: false
        type: string
        default: ''
      restore_procedure_ref:
        description: 'Backup evidence — link/reference to the restore procedure (empty ⇒ RED).'
        required: false
        type: string
        default: ''
      backup_responsible:
        description: 'Backup evidence — who owns the apply decision (empty ⇒ RED).'
        required: false
        type: string
        default: ''
      operational_window:
        description: 'Backup evidence — agreed operational/maintenance window (empty ⇒ RED).'
        required: false
        type: string
        default: ''

# Least privilege: read-only, no write, no id-token, no packages.
permissions:
  contents: read

# Serialize; never cancel a running preflight.
concurrency:
  group: sg8-r0-preflight-production-db
  cancel-in-progress: false

env:
  # Non-secret: the project ref appears in the project URL (mirrors entity-db-apply.yml).
  SUPABASE_PROJECT_REF: pwbkplzyzmortwjjpcbg
  # The remote major MUST equal the major the 0008/0009 harness validated.
  EXPECTED_PG_MAJOR: '15'

jobs:
  guard:
    name: Validate intent (format + confirm phrase + main-only) — no checkout, no DB
    runs-on: ubuntu-latest
    steps:
      - name: Assert dispatch ref is main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::R0 may be dispatched ONLY from main (got $REF). Aborting."; exit 1
          fi
          echo "Dispatch ref is main."

      - name: Assert target_sha is a FULL 40-char lowercase commit SHA
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full 40-char lowercase hex commit SHA. Aborting with no checkout."; exit 1
          fi
          echo "target_sha format OK."

      - name: Validate confirmation phrase
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "PREFLIGHT-SG8-R0-READONLY-NO-WRITES" ]; then
            echo "::error::Confirmation phrase mismatch — aborting (nothing runs)."; exit 1
          fi
          echo "Confirmation accepted."

  preflight:
    name: Read-only remote preflight (single snapshot; ROLLBACK)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The ONLY Environment. Inherits required reviewers + main-only branch policy.
    environment: production-db
    steps:
      - name: Re-assert main + target_sha format (defense-in-depth, before checkout)
        env:
          REF: ${{ github.ref }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] || { echo "::error::not main"; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha"; exit 1; }

      - name: Checkout EXACTLY target_sha
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert HEAD == target_sha == CURRENT origin/main tip (a commit)
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          [ "$head" = "$TARGET_SHA" ] || { echo "::error::HEAD ($head) != target_sha ($TARGET_SHA)"; exit 1; }
          [ "$(git cat-file -t "$TARGET_SHA")" = "commit" ] || { echo "::error::target_sha not a commit"; exit 1; }
          # TIP-OF-MAIN (stricter than ancestor): target_sha MUST equal the CURRENT
          # remote main tip at dispatch time. Any advance of main between the R0
          # authorization and this dispatch INVALIDATES the gate; a stale ancestor
          # SHA is REJECTED even though it is reachable from main. This binds the
          # preflight to the exact bytes that will be applied next.
          git fetch --no-tags origin main
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$TARGET_SHA" != "$tip" ]; then
            echo "::error::target_sha ($TARGET_SHA) != current origin/main tip ($tip). main advanced or the SHA is stale (ancestor≠tip). Re-authorize against the new tip. Refusing."
            exit 1
          fi
          echo "HEAD == target_sha == origin/main tip ($tip) — a commit; main-only + tip-of-main satisfied."

      - name: Assert the R0 SQL + evaluator are tracked at target_sha and present
        run: |
          set -euo pipefail
          for f in supabase/remote/sg8_r0_preflight_pre_0008.sql supabase/remote/r0_evaluate.sh; do
            git cat-file -e "HEAD:$f" 2>/dev/null || { echo "::error::$f not tracked at target_sha"; exit 1; }
            test -f "$f" || { echo "::error::$f missing on disk"; exit 1; }
          done
          echo "R0 SQL + evaluator present."

      - name: Install psql client (talks ONLY to the remote via masked URL)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Build MASKED DB URL (session pooler — IPv4-safe; no CLI, no link)
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
          DB_PORT: ${{ vars.SUPABASE_DB_PORT }}
          DB_USER: ${{ vars.SUPABASE_DB_USER }}
        run: |
          set -euo pipefail
          : "${DB_PASSWORD:?missing secret SUPABASE_DB_PASSWORD in Environment production-db}"
          : "${DB_HOST:?missing variable SUPABASE_DB_HOST in Environment production-db}"
          user="${DB_USER:-postgres.${SUPABASE_PROJECT_REF}}"
          port="${DB_PORT:-5432}"
          # URL-encode the password (no jq dependency; pure bash percent-encoding).
          enc_pw=""
          for ((i=0; i<${#DB_PASSWORD}; i++)); do
            c="${DB_PASSWORD:$i:1}"
            case "$c" in
              [a-zA-Z0-9.~_-]) enc_pw+="$c" ;;
              *) enc_pw+=$(printf '%%%02X' "'$c") ;;
            esac
          done
          url="postgresql://${user}:${enc_pw}@${DB_HOST}:${port}/postgres?sslmode=require"
          echo "::add-mask::${url}"
          echo "SUPABASE_DB_URL=${url}" >> "$GITHUB_ENV"
          # Non-secret host is a variable, safe to surface for the report.
          echo "R0_DB_HOST=${DB_HOST}" >> "$GITHUB_ENV"

      - name: Run READ-ONLY preflight (single session; SQL ends in ROLLBACK)
        env:
          SUPABASE_DB_URL: ${{ env.SUPABASE_DB_URL }}
          R0_DB_HOST: ${{ env.R0_DB_HOST }}
        run: |
          set -euo pipefail
          # ON_ERROR_STOP=1: a fatal boundary breach (or connection error) fails the job.
          # The SQL prints the human report + machine blocks (R0-CANON, R0-LEDGER) + a
          # DB-side R0_VERDICT. Output has NO secret (URL is masked; SQL prints no password).
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -v expected_ref="$SUPABASE_PROJECT_REF" \
            -v expected_host="$R0_DB_HOST" \
            -f supabase/remote/sg8_r0_preflight_pre_0008.sql | tee r0_output.txt

      - name: Backup-evidence gate + evaluate (ledger-set + verdict + digest via r0_evaluate.sh)
        env:
          B_PITR: ${{ inputs.backup_pitr_available }}
          B_TS: ${{ inputs.backup_timestamp }}
          B_RESTORE: ${{ inputs.restore_procedure_ref }}
          B_RESP: ${{ inputs.backup_responsible }}
          B_WINDOW: ${{ inputs.operational_window }}
        run: |
          set -euo pipefail
          # --- operator backup evidence gate (RED-default; no token, no external call) ---
          # The 5 fields are supplied by the operator at dispatch and validated by the
          # human Environment reviewer against the referenced evidence BEFORE approval.
          # Any empty/placeholder value ⇒ backup_ok=false ⇒ FINAL RED. The workflow
          # NEVER self-attests backup and NEVER accepts a TECHNICAL_GREEN authorization.
          backup_ok=true; miss=""
          [ "$B_PITR" = "yes" ] || { backup_ok=false; miss+="pitr/backup-not-confirmed; "; }
          check() { local n="$1" v; v="$(printf '%s' "${2:-}" | tr '[:upper:]' '[:lower:]' | xargs || true)"
            case "$v" in ''|na|n/a|none|null|todo|tbd|-|pending|placeholder) backup_ok=false; miss+="$n-empty; ";; esac; }
          check "timestamp" "$B_TS"; check "restore" "$B_RESTORE"; check "responsible" "$B_RESP"; check "window" "$B_WINDOW"

          # --- evaluate the single-session preflight output (shared evaluator) ---
          set +e
          eval_out="$(bash supabase/remote/r0_evaluate.sh r0_output.txt supabase/migrations "$backup_ok")"
          code=$?
          set -e
          printf '%s\n' "$eval_out"
          final="$(printf '%s\n' "$eval_out" | grep -oE 'R0_FINAL=(GREEN|RED)' | cut -d= -f2)"
          digest="$(printf '%s\n' "$eval_out" | grep -oE 'R0_DIGEST=[0-9a-f]{64}' | cut -d= -f2 || true)"

          # --- sanitized step summary: technical result vs backup evidence SEPARATED;
          #     FINAL is strictly GREEN xor RED (no GREEN-WITH-NOTES, no TECHNICAL_GREEN). ---
          {
            echo "## SG-8 · R0 Preflight — FINAL \`${final}\`"
            echo ""
            echo "### Technical result (automated)"
            printf '%s\n' "$eval_out" | grep -E 'R0_TECHNICAL_DB_VERDICT|R0_LEDGER_SET_OK|R0_REMOTE_LEDGER|R0_DIGEST' | sed 's/^/- /'
            echo ""
            echo "### Operator backup evidence (gates FINAL; RED-default)"
            echo "- backup_ok: \`${backup_ok}\`${miss:+ (missing: ${miss})}"
            echo "- pitr=\`${B_PITR}\` timestamp=\`${B_TS:-<empty>}\` restore=\`${B_RESTORE:-<empty>}\` responsible=\`${B_RESP:-<empty>}\` window=\`${B_WINDOW:-<empty>}\`"
            echo ""
            echo "_FINAL is GREEN only if technical GREEN **and** backup evidence complete._"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "R0 FINAL=$final DIGEST=${digest:-<none>} backup_ok=$backup_ok (evaluate exit=$code)"
          if [ "$final" != "GREEN" ]; then
            echo "::error::R0 FINAL=RED (backup_ok=$backup_ok ${miss}). No migration is authorized."
            exit 1
          fi
          echo "R0 GREEN — environment compatible, SG-8 objects absent, backup evidence complete. (Still no GO for R1.)"
